# JARVIS Configuration & Safety Policy
version: "2.0"

voice:
  # Keep "sapi" for offline Windows speech. Set to "edge" after installing edge-tts.
  engine: "sapi"
  name: "en-GB-RyanNeural"
  rate: "+0%"
  pitch: "+0Hz"
  volume: "+0%"
  cache_dir: "data/tts-cache"

safety:
  confirmation_timeout_seconds: 5.0
  action_log_path: "logs/actions.log"
  sandbox_dir: "data/sandbox"

  # Tier 1: Safe actions - executed immediately without prompt
  tier1_safe:
    - open_app
    - open_url
    - search_google
    - search_youtube
    - type_notepad
    - type_calc
    - control_window
    - control_volume
    - read_file
    - list_dir
    - find_files
    - create_folder
    - list_running
    - open_path
    - file_info
    - get_system_stats
    - screenshot
    - ui_inspect
    - browser_open
    - browser_search
    - browser_fetch
    - ocr_screenshot
    - system_status

  # Tier 2: System-altering / destructive actions - confirmation required or 5s voice cancel window
  tier2_confirm:
    - delete_file          # ALWAYS uses send2trash (Recycle Bin)
    - close_app
    - shutdown
    - restart
    - sleep
    - lock
    - write_file
    - copy_file
    - move_file
    - rename_file
    - append_file
    - kill_process
    - zip_files
    - unzip_file
    - run_powershell
    - ui_click
    - ui_type

  # Tier 3: Blocked actions - strictly prohibited under all circumstances
  tier3_blocked:
    - format_drive
    - delete_system_dir
    - mass_delete
    - wipe_disk
    - edit_registry_system
    - clear_event_logs

blocked_paths:
  - "C:\\Windows"
  - "C:\\Program Files"
  - "C:\\Program Files (x86)"
  - "C:\\Users\\Default"
  - "C:\\Recovery"
  - "C:\\Boot"

blocked_command_patterns:
  - "(?i)rmdir\\s+/[sS]"
  - "(?i)del\\s+/[fF]"
  - "(?i)format\\s+[a-zA-Z]:"
  - "(?i)diskpart"
  - "(?i)vssadmin\\s+delete"
  - "(?i)bcdedit"
  - "(?i)reg\\s+delete"
  - "(?i)wevtutil\\s+cl"
  - "(?i)(remove-item|ri|del|erase|rd|rmdir)\\b.*(-recurse|-force|/s|/q)"
  - "(?i)(remove-item|ri|del|erase|rd|rmdir)\\b.*(C:\\\\Windows|C:\\\\Program Files|C:\\\\Recovery|C:\\\\Boot)"
  - "(?i)(clear-content|set-content|out-file|add-content)\\b.*(C:\\\\Windows|C:\\\\Program Files|C:\\\\Recovery|C:\\\\Boot)"
  - "(?i)(shutdown|restart-computer|stop-computer|format-volume|clear-disk|diskpart)"
